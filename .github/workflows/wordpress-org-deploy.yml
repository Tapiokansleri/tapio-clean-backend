name: Deploy to WordPress.org

# WordPress.org does not pull from GitHub. This workflow pushes a published
# GitHub release into plugin SVN so sites receive the update from wordpress.org.
on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  wordpress:
    name: WordPress.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: tapio-clean-backend

      - name: Attach zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
